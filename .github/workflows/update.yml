name: Update profile README

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - "config.js"
      - "scripts/**"

permissions:
  contents: write   # commit the updated README
  actions: write    # keep this scheduled workflow from being auto-disabled

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Resets GitHub's 60-day inactivity timer for scheduled workflows.
      - name: Keep schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update README
        run: node scripts/update.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changes
        run: |
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add README.md activity-heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile stats"
            git pull --rebase
            git push
          fi
